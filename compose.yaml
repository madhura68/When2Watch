name: when2watch
services:
  web:
    build: .
    image: when2watch:${RELEASE_TAG:-local}
    restart: unless-stopped
    user: "1000:1000"
    # DATABASE_URL (runtime DML role) comes only from the private .env.
    env_file: .env
    environment:
      NODE_ENV: production
      TZ: Europe/Amsterdam
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      db:
        condition: service_healthy
    networks:
      proxy:
        aliases: [when2watch-web]
      database: {}
    read_only: true
    # Append-only deletion journal (P10), outside the database volume and its backups; host dir 0700, uid 1000.
    volumes:
      - /srv/apps/when2watch/journal:/journal
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # Separate release action with the DDL role: `docker compose --profile migrate run --rm migrate`.
  migrate:
    image: when2watch:${RELEASE_TAG:-local}
    profiles: [migrate]
    user: "1000:1000"
    env_file: .env.migrate
    command: [sh, scripts/migrate.sh]
    depends_on:
      db:
        condition: service_healthy
    networks: [database]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  # Own PostgreSQL 17 for When2Watch only; no host port, internal network only.
  db:
    image: postgres:17
    restart: unless-stopped
    env_file: .env.db
    volumes:
      - /srv/apps/when2watch/postgres:/var/lib/postgresql/data
      - ./deploy/postgres-init.sh:/docker-entrypoint-initdb.d/10-when2watch.sh:ro
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U postgres -d when2watch"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  proxy:
    external: true
    name: scrum4me_default
  database:
    internal: true
